name: Actualizar noticias

on:
  schedule:
    - cron: "0 * * * *"   # cada hora, en punto
  workflow_dispatch:       # también se puede lanzar a mano desde la pestaña Actions

permissions:
  contents: write

concurrency:
  group: actualizar-noticias
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generar noticias y fotos
        run: python scripts/generar_datos.py

      - name: Guardar cambios en el repositorio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data
          if ! git diff --cached --quiet; then
            git commit -m "Actualiza noticias"
            git push
          fi
